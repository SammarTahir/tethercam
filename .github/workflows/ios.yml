name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test TSMuxer
        working-directory: ios/TSMuxer
        run: swift test

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project TetherCam.xcodeproj \
            -scheme TetherCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          ditto ios/build/Build/Products/Release-iphoneos/TetherCam.app dist/Payload/TetherCam.app
          cd dist
          zip -qry TetherCam-unsigned.ipa Payload
          ls -lh TetherCam-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TetherCam-unsigned-ipa
          path: dist/TetherCam-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TetherCam-unsigned-ipa

      - name: Attach IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" TetherCam-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "TetherCam $GITHUB_REF_NAME" \
            --generate-notes
